services:
  main:
    image: ${GYM_VERIFIER_IMAGE:?Prepare a digest-pinned verifier image}
    pull_policy: never
    command: ["sleep", "infinity"]
    network_mode: none
    volumes:
      - verifier-auth:/run/verifier-auth:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1
    mem_limit: 256m
volumes:
  verifier-auth:
    external: true
    name: ${GYM_VERIFIER_VOLUME:?Use this trial's verifier identity volume}
